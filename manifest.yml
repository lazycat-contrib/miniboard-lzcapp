lzc-sdk-version: "0.1"
name: miniboard
package: cloud.lazycat.app.miniboard
version: 0.0.1
description: 轻量但全能的仪表盘软件
homepage: https://github.com/aceberg/miniboard
author: aceberg
application:
  subdomain: miniboard
  background_task: true
  multi_instance: false
  gpu_accel: false
  kvm_accel: false
  usb_accel: false
  routes:
    - /=http://miniboard.cloud.lazycat.app.miniboard.lzcapp:8849/
services:
  miniboard:
    image: registry.lazycat.cloud/czyt/aceberg/miniboard:358d16bed38ad317
    environment:
      - TZ=Asia/beijing
      - HOST=0.0.0.0
      - PORT=8849
      - THEME=flatly
      - COLOR=dark
    binds:
      - /lzcapp/var/miniboard:/data/miniboard
    setup_script: |     
      if [ -z "$(find /data/miniboard/board.yaml -mindepth 1 -maxdepth 1)" ]; then
          cp  /lzcapp/pkg/content/board.yaml  /lzcapp/var/miniboard/
      fi
unsupported_platforms:
  - ios
  - android